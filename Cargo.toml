[package]
name = "ship"
version = "0.3.1"
edition = "2021"
description = "One command pre-deploy checklist: tests, secrets, TODOs, logs, and more"
license = "MIT"
authors = ["ship"]
readme = "README.md"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
colored = "=2.1.0"
walkdir = "=2.4.0"
regex = "=1.10.2"
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
anyhow = "=1.0.79"
thiserror = "=1.0.56"

[profile.release]
lto = true
codegen-units = 1
strip = true
