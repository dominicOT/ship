name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: ship-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            asset: ship-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install gcc-aarch64-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package asset
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}" ship
      - name: Show dist contents
        run: |
          echo "Dist listing:"
          ls -la dist || true
          echo "Tar contents (if present):"
          tar -tzf dist/${{ matrix.asset }} || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  create-release:
    name: Create release and attach assets
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./dist
      - name: Show downloaded dist
        run: |
          echo "Downloaded files:"
          ls -la dist || true
      - name: Create or update draft release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: true
      - name: Publish release (clear draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${{ github.ref_name }}
          repo=${{ github.repository }}
          echo "Finding release for tag $tag in $repo"
          release_json=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$repo/releases/tags/$tag")
          release_id=$(echo "$release_json" | jq -r .id)
          if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
            echo "Release not found; exiting"
            exit 1
          fi
          echo "Publishing release id=$release_id"
          curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"draft":false}' "https://api.github.com/repos/$repo/releases/$release_id"

