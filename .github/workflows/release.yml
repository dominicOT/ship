name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ship-linux-x86_64.tar.gz
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ship-macos-x86_64.tar.gz
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ship-macos-aarch64.tar.gz
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}" ship
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset }}
