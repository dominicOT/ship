name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ship-linux-x86_64.tar.gz
            archive: tar
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: ship-linux-aarch64.tar.gz
            archive: tar
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ship-macos-x86_64.tar.gz
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ship-macos-aarch64.tar.gz
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ship-windows-x86_64.zip
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install gcc-aarch64-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package as tar.gz (Unix)
        if: matrix.archive == 'tar'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}" ship
      - name: Package as zip (Windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          7z a -tzip ../../../../dist/${{ matrix.asset }} ship.exe
      - name: Show dist contents
        run: |
          echo "Dist listing:"
          ls -la dist || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  create-release:
    name: Create release and attach assets
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true
      - name: Validate downloaded artifacts
        run: |
          echo "Downloaded files:"
          ls -la dist || true
          for file in dist/*.tar.gz; do
            echo "Checking $file"
            tar -tzf "$file" | head
          done
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          fail_on_unmatched_files: true

